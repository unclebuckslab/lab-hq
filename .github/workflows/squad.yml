name: Squad checks

# Offline checks on every change; the live agent evals when an agent, its skill, its gold set or its model changes.
# Decision: decisions/2026-11-24-m3-scope.md. AGENT_SAFETY section 4: a failed eval blocks the merge.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: squad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Registry and squad checks (offline)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install PyYAML==6.0.3
      - run: python registry/validate.py
      - run: python evals/check.py

  evals:
    name: Agent evals (live, about $0.45)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0
      - name: Did an agent change?
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if git diff --name-only "$base" HEAD 2>/dev/null | grep -qE '^(\.claude/agents/|\.claude/skills/|evals/|config/agents\.yaml|scripts/agent_output\.py)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "No agent files changed; live evals skipped." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        if: steps.changed.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Score the researcher, editor and auditor against their gold sets
        if: steps.changed.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY isn't set for this repo, so the agent evals can't run. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          pip install -r evals/requirements.txt
          python evals/run.py
