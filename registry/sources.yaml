# Every data source the lab pulls or has approved for use. One record each.
# Fields are defined in registry/README.md. Run `python registry/validate.py` after any edit.
#
# Rules (decisions/2026-11-21-lab-data-layer.md):
# - A project pulls only from a source listed here, and publishes it only where `publish` is true.
# - Tiers are set by the founder. A new source is added with a proposed tier and `tier_approved: null`.
# - License checks are dated, re-checked yearly or when a publisher changes its terms. They are a
#   good-faith reading of published terms, not legal advice.
# - State and local government data is not automatically public domain; each gets its own check.
# - Ingest from the original publisher and credit it. Discovery tools (bottom of file) are never the credit.
#
# Built Nov 21, 2026 from DorkGraphs' source library v0.2 (sources 1-34), the AI Money Report's
# config/sources.yaml and hand-kept tables, and the Denver dashboard's handbook/DATA.md.

sources:

  # ---------------------------------------------------------------- Federal statistics

  - id: bls
    name: Bureau of Labor Statistics
    tier: A
    tier_approved: 2026-11-09
    license: cleared
    license_checked: 2026-11-09
    conditions: []
    credit: Bureau of Labor Statistics
    covers: Inflation (CPI), employment and unemployment (CPS, CES), wages by occupation (OEWS), time use (ATUS), consumer spending (CE), employment projections.
    known_breaks:
      - CPS redesign in 1994.
      - CPI methodology changes over time; use R-CPI-U-RS for long comparisons.
      - Occupation classification changes (SOC 2010, SOC 2018).
    access: API and bulk downloads
    status: listed
    publish: true
    pipelines: []
    used_by: [dorkgraphs, denver-sales]
    notes: Denver pulls CPI-U (CPIAUCSL) through FRED and credits FRED; it should pull from BLS and credit BLS. Fix when the Denver repo moves into the lab org.

  - id: census
    name: Census Bureau
    tier: A
    tier_approved: 2026-11-09
    license: cleared
    license_checked: 2026-11-09
    conditions: []
    credit: U.S. Census Bureau
    covers: American Community Survey, CPS income and poverty supplement, decennial census, population estimates, state and local government finances, Monthly Retail Trade, Value of Construction Put in Place (data center construction).
    known_breaks:
      - 2020 ACS 1-year estimates were released only as experimental data; don't treat 2020 as a normal year.
      - CPS income questions were redesigned for 2013 income data; trends across that year need the bridge file or a caveat.
      - The new combined race and ethnicity question (SPD 15) enters ACS collection in 2027; first 1-year estimates on it in Sept 2028.
      - 2020 decennial small-area counts include deliberate privacy noise; avoid very small geographies.
      - Construction spending on data centers is broken out only in the published annual tables, from 2014; the API stops at "Office".
    access: API (data.census.gov) and published tables
    status: active
    publish: true
    pipelines:
      - {repo: unclebuckslab/ai-money-report, path: pipelines/census/, schedule: monthly (5th)}
    used_by: [ai-money-report, dorkgraphs]
    notes: null

