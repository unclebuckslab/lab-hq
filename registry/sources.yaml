  # ---------------------------------------------------------------- Money, filings and power

  - id: sec-edgar
    name: SEC EDGAR filings
    tier: A
    tier_approved: 2026-11-10
    license: cleared-with-conditions
    license_checked: 2026-11-10
    conditions:
      - Declare a user agent with a contact email, stay under 10 requests per second, download only what is needed.
      - Word company figures as what the company reported.
      - 13F covers only certain U.S.-listed securities held by large managers, filed up to 45 days after the quarter; every 13F use says so.
    credit: Company name and filing (e.g. "Company X, 2025 annual report (SEC filing)")
    covers: Form D startup raises, company financials (XBRL company facts), insider trades (Form 4), capital raises (8-K items 1.01-2.03, prospectuses), 10-Q/10-K footnote commitments, executive pay (pay-versus-performance tags), 13F institutional holdings, cover-page share counts.
    known_breaks:
      - The archive returns 403, not 404, for a missing optional file; weekends have no daily index.
      - Companies file the same item under different XBRL tags and switch tags over time; cash flow in 10-Qs is year to date.
    access: EDGAR APIs, archives and bulk data sets
    status: active
    publish: true
    pipelines:
      - {repo: unclebuckslab/ai-money-report, path: pipelines/form_d/, schedule: daily}
      - {repo: unclebuckslab/ai-money-report, path: pipelines/xbrl/, schedule: weekly (Tue)}
      - {repo: unclebuckslab/ai-money-report, path: pipelines/form4/, schedule: weekly (Mon)}
      - {repo: unclebuckslab/ai-money-report, path: pipelines/raises/, schedule: weekly (Wed)}
      - {repo: unclebuckslab/ai-money-report, path: pipelines/footnotes/, schedule: with financials}
      - {repo: unclebuckslab/ai-money-report, path: pipelines/ownership/, schedule: monthly (8th)}
    used_by: [ai-money-report, dorkgraphs]
    notes: The shared SEC client lives in ai-money-report pipelines/common/sec.py. Moves to lab-data only when a second project pulls SEC data.

  - id: lda
    name: Lobbying Disclosure Act filings (LDA.gov)
    tier: A
    tier_approved: 2026-11-10
    license: cleared-with-conditions
    license_checked: 2026-11-10
    conditions:
      - Cite the retrieval date.
      - State that the Senate "cannot vouch for the data or analyses derived from these data".
      - Never use the Senate seal; never modify or misrepresent the data while citing the Senate.
      - Use LDA.gov; the older lda.senate.gov site was scheduled to retire after July 31, 2026.
    credit: U.S. Senate Office of Public Records (LDA.gov), retrieved [date]
    covers: Who lobbies, for which clients, on which issues, and reported spending, quarterly.
    known_breaks:
      - Spending is reported in ranges and rounded amounts; issue codes are self-reported.
      - Amendments replace originals; a plain client-name search pulls in unrelated clients and misses "FIRM ON BEHALF OF CLIENT" forms.
    access: API (higher rate limit with a free key)
    status: active
    publish: true
    pipelines:
      - {repo: unclebuckslab/ai-money-report, path: pipelines/lobbying/, schedule: monthly (23rd)}
    used_by: [ai-money-report, dorkgraphs, congress-cards]
    notes: First pipeline to move into lab-data (milestone D3), when Congress Cards starts.

