    used_by: [dorkgraphs]
    notes: "License per the data.cms.gov API guide (U.S. government works are public domain; attribution appreciated; some datasets carry their own license) and CMS's data-use policy (public use files need no data use agreement). The r001 enrollment files are public use files."


