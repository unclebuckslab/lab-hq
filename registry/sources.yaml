      - CC BY 3.0 - credit the City and County of Denver and indicate the license.
      - Buyer and seller names never leave the fetch step; only entity and same-party flags are kept.
    credit: City and County of Denver Open Data Catalog (CC BY 3.0)
    covers: Real property sales and transfers, residential characteristics, parcels, statistical neighborhoods.
    known_breaks:
      - Sales history starts in 2015.
