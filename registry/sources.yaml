  - id: congress-disclosures
    name: Congressional financial disclosures (House Clerk and Senate)
    tier: A
    tier_approved: 2026-11-10
    license: cleared-with-conditions
    license_checked: 2026-11-10
    conditions:
      - Federal ethics law limits commercial use to news and communications media publishing to the general public; the lab relies on that exception (confirmed by the founder 2026-11-10).
      - Amounts are value ranges; show ranges, never invented point values.
      - Never imply wrongdoing from a trade alone; apply evenly across parties.
    credit: Office of the Clerk, U.S. House of Representatives; Secretary of the Senate
    covers: Members' annual financial disclosures and STOCK Act periodic transaction reports.
    known_breaks: []
    access: downloads
    status: listed
    publish: true
    pipelines: []
    used_by: [dorkgraphs, congress-cards]
    notes: Congress Cards profiles don't publish before the LLC exists (milestone S2).

  - id: ecb-fx
    name: European Central Bank euro reference rates
    tier: A
    tier_approved: 2026-11-21
    license: cleared-with-conditions
    license_checked: 2026-11-21
    conditions:
      - Quote the source ("Source - ECB statistics") and never modify the statistics or their metadata. Converting an amount with a published rate is a use, not a modification; the converted figure is labeled an estimate with its rate and date.
      - The ECB policy doesn't cover third-party data inside ECB releases.
    credit: "Source: ECB statistics"
    covers: Daily euro foreign exchange reference rates, used to convert foreign-currency capital raises on the filing date.
    known_breaks:
      - The ECB says the rates are published for information only; no EUR/RUB rate since March 1, 2022.
    access: history zip download
    status: active
    publish: true
    pipelines:
      - {repo: unclebuckslab/ai-money-report, path: pipelines/raises/fx.py, schedule: with capital raises}
    used_by: [ai-money-report]
    notes: License per the ESCB policy on reusing ESCB statistics (free of charge, commercial or not, with the source quoted and the statistics unmodified).

