  - id: cdc-nchs
    name: CDC National Center for Health Statistics (CDC WONDER)
    tier: A
    tier_approved: 2026-11-09
    license: cleared-with-conditions
    license_checked: 2026-11-09
    conditions:
      - Never publish statistics representing nine or fewer births or deaths, including rates built on them.
      - Lab rule on top of that - no rate built on fewer than 20 events.
      - Never try to identify a person or establishment, and never study the privacy protections themselves.
    credit: CDC National Center for Health Statistics
    covers: Deaths by cause, births, life expectancy, health measures by state and county.
    known_breaks:
      - Cause-of-death coding moved from ICD-9 to ICD-10 in 1999; causes aren't directly comparable across that line.
      - Final annual data lags about two years; provisional data is labeled preliminary.
    access: WONDER query tool and API
    status: listed
    publish: true
    pipelines: []
    used_by: [dorkgraphs]
    notes: null

  - id: cms
    name: Centers for Medicare & Medicaid Services
    tier: A
    tier_approved: 2026-11-21
    license: cleared-with-conditions
    license_checked: 2026-11-21
    conditions:
      - Public use files only (data.cms.gov, data.medicaid.gov). Never data that needs a data use agreement.
      - Check each dataset's page for its own license; data.cms.gov says some datasets carry restrictions.
