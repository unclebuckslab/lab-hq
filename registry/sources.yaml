    covers: Health insurance marketplace enrollment (effectuated enrollment, open enrollment reports), data.cms.gov datasets.
    known_breaks:
      - Plan selections at open enrollment and effectuated (paid-up) enrollment are different measures; never mix them on one chart.
    access: data.cms.gov catalog and downloads
    status: active
    publish: true
    pipelines:
