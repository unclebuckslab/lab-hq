# Tools for finding data. They are never the source a figure is credited to.
discovery_tools:
  - id: fred
    name: FRED (Federal Reserve Bank of St. Louis)
    checked: 2026-11-09
    rule: Use FRED to find series, then ingest from the original agency and credit it. Never pull a series marked "Copyrighted - Pre-approval required". FRED's terms permit personal, non-commercial use only.
  - id: our-world-in-data
    name: Our World in Data
    checked: 2026-11-09
    rule: Use OWID to find datasets and providers, then ingest from and credit the original provider after checking its license.
  - id: ipums
    name: IPUMS
    checked: 2026-11-09
    rule: Prefer published Census tables. Use IPUMS only after written confirmation that derived aggregates may be published, and cite it as required.
  - id: internet-archive
    name: Internet Archive (Wayback Machine)
    checked: null
    rule: An access route only, for publishers that block automated downloads (CBO). Fetch the unmodified copy of the publisher's URL, record both URLs, and credit the publisher.
