  - id: P2
    name: DorkGraphs discovery front end
    after: [D2]
    est_hours: 8
    actual_hours: null
    status: in-progress
    done_means: The release watcher and pattern scan (DorkGraphs pipeline steps 0 and 4) run as code on the latest snapshots; a weekly workflow posts the leads digest to one issue; the release calendar entries each carry the agency schedule URL and read date; tests pass; three Sunday digests have run and Garrett has used one in a hand-run lead screen. The lead-screen agent (step 4b) is a later milestone, written from what the hand-run teaches.

